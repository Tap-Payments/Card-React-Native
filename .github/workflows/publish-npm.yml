# Releases card-react-native when something is merged into main.
#
# Runs `release-it` in CI (patch by default): bumps package.json, commits `chore: release x.y.z`,
# tags `vx.y.z`, pushes, creates the GitHub release, then publishes to npm.
# Can also be run manually from the Actions tab to pick minor or major.
#
# Uses npm Trusted Publishing (OIDC), so no npm token is needed. On npmjs.com, the
# card-react-native package must list this repo and `publish-npm.yml` as its trusted publisher.

name: Publish npm

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version bump'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  id-token: write

# Two merges close together release one after the other, never at the same time
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The release commit pushed by this job must not start another release
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    env:
      # No git hooks in CI, commit messages here come from release-it
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # release-it needs the tags to find the last version and build the changelog
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Enable corepack (yarn 3.6.1 from packageManager)
        run: |
          corepack enable
          yarn --version

      # Trusted publishing needs npm 11.5.1 or newer, node 20 ships with npm 10
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn prepare

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Bumps, commits, tags, pushes and creates the GitHub release. npm.publish is false in the
      # release-it config, publishing is the next step
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn release-it ${{ inputs.increment || 'patch' }} --ci

      # A re-run for a version that is already on npm would be rejected as a duplicate
      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "card-react-native@$VERSION" version > /dev/null 2>&1; then
            echo "card-react-native@$VERSION is already on npm, nothing to publish"
            exit 0
          fi
          npm publish --access public
