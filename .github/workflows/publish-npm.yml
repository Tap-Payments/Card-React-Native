# Publishes card-react-native to npm.
#
# Triggered by pushing a version tag (ex v1.0.9), or manually for an existing tag.
# Uses npm Trusted Publishing (OIDC), so no token or secret is needed. On npmjs.com, the
# card-react-native package must list this repo and `publish-npm.yml` as its trusted publisher.

name: Publish npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, ex v1.0.9'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Enable corepack (yarn 3.6.1 from packageManager)
        run: |
          corepack enable
          yarn --version

      # Trusted publishing needs npm 11.5.1 or newer, node 20 ships with npm 10
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check package version matches the tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn prepare

      # A re-run for a version that is already on npm would be rejected as a duplicate
      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "card-react-native@$VERSION" version > /dev/null 2>&1; then
            echo "card-react-native@$VERSION is already on npm, nothing to publish"
            exit 0
          fi
          npm publish --access public
